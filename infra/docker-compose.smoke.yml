# Override SÓ para o smoke local (scripts/smoke-stack.sh): Caddy em HTTP numa porta alta de
# 127.0.0.1 (sem TLS, sem DNS, sem tocar nas portas 80/443 do host) e backup rápido.
# Nunca use em produção.
services:
  caddy:
    ports: !override
      - "127.0.0.1:${SMOKE_PORT:-55443}:80"
    # !override troca a lista INTEIRA: sem repetir caddy_data/caddy_config o smoke rodava um Caddy sem /data e /config
    # (somente leitura) e a checagem de escrita falhava por culpa do override, não do compose de produção.
    volumes: !override
      - ./Caddyfile.smoke:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  postgres-backup:
    environment:
      BACKUP_INTERVAL_SECONDS: "3600"
