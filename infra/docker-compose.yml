# Stack de produção do MeuCardapio. Só o Caddy publica portas (80/443); Postgres, API e web ficam
# na rede interna do compose — não há como contornar TLS/proxy acessando 3000/3001 direto.
# Acesso administrativo ao banco: `docker compose exec postgres psql -U meucardapio`.
#
# Subir (dev/staging): docker compose --env-file .env up -d --build  (veja infra/.env.example). Runbook e validação do .env: INF-11.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-build: &api-build
  context: ..
  dockerfile: apps/api/Dockerfile

services:
  postgres:
    networks: [data]            # só na rede de dados (interna, sem saída à internet): caddy e web não alcançam o banco
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Fuso do servidor FIXO em UTC (garantia): as colunas TIMESTAMP(3) do Prisma não têm fuso e o PrintJob (API-12)
    # usa CURRENT_TIMESTAMP AT TIME ZONE 'UTC'. Mudar isto sem migrar os dados desloca todas as datas gravadas.
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_USER: meucardapio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: meucardapio
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meucardapio -d meucardapio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplica as migrações pendentes (prisma migrate deploy) e termina. A API só sobe depois que
  # isto sai com sucesso; se a migração falhar, a API antiga continua rodando e o deploy para.
  migrate:
    networks: [data]
    build: *api-build
    image: meucardapio-api:${APP_VERSION:-local}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meucardapio:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/meucardapio?schema=public
    working_dir: /repo/packages/db
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"

  api:
    networks: [default, data]   # default = rede de borda (Caddy, web, internet para MP/e-mail); data = banco
    build: *api-build
    image: meucardapio-api:${APP_VERSION:-local}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://meucardapio:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/meucardapio?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:?defina WEB_ORIGIN no .env, com https e sem barra final}
      MFA_HMAC_KEY: ${MFA_HMAC_KEY:?defina MFA_HMAC_KEY no .env, 32 ou mais caracteres e diferente do JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Só o Caddy (IP fixo, ver networks) pode ditar o IP do cliente via X-Forwarded-For (B04/ST-02).
      TRUST_PROXY_CIDR: ${CADDY_IP:-172.29.250.10}/32   # derivado do IP fixo do Caddy: não há como divergir
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-14}
      # SEC-34: a faixa de hash (hashLane) dimensiona as vagas em voo por min(UV_THREADPOOL_SIZE / 2, núcleos − 1). O padrão do Node é 4; fica EXPLÍCITO aqui para o
      # dimensionamento não depender do padrão e aparecer no `compose config`. Subir só junto com mais núcleos (cada hash de senha ocupa 1 thread por ~45 ms).
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-4}
      # Segredo de serviço (SEC-24), o MESMO do web. Rotação sem queda: ponha o novo em API_INTERNAL_SECRET e o antigo em
      # API_INTERNAL_SECRET_PREVIOUS (a API aceita os dois), suba api e web, e depois esvazie o PREVIOUS.
      API_INTERNAL_SECRET: ${API_INTERNAL_SECRET:?defina API_INTERNAL_SECRET no .env (32+ caracteres; openssl rand -hex 32)}
      API_INTERNAL_SECRET_PREVIOUS: ${API_INTERNAL_SECRET_PREVIOUS:-}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}   # jobs no processo da API (ADR-0011); false só para depurar
      # PIX por loja (API-07, ADR-0001): desligado por padrão. As regras CONDICIONAIS (com MP_OAUTH_MODE=real exige chave de cifra
      # própria, MP_CLIENT_ID/SECRET e PUBLIC_API_URL https) o compose não expressa: ficam em infra/check-env.sh (rode antes de subir) e
      # a própria API recusa subir fora delas. `fake` só em desenvolvimento.
      MP_OAUTH_MODE: ${MP_OAUTH_MODE:-off}
      PAYMENT_ENC_KEY: ${PAYMENT_ENC_KEY:-}
      PAYMENT_ENC_KEY_ID: ${PAYMENT_ENC_KEY_ID:-v1}
      PAYMENT_ENC_KEY_PREV: ${PAYMENT_ENC_KEY_PREV:-}
      PAYMENT_ENC_KEY_PREV_ID: ${PAYMENT_ENC_KEY_PREV_ID:-}
      MP_CLIENT_ID: ${MP_CLIENT_ID:-}
      MP_CLIENT_SECRET: ${MP_CLIENT_SECRET:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      # Revalidação do cardápio sob demanda (API-58): a API chama o web PELA REDE INTERNA (nunca pelo Caddy) com este segredo. Sem as DUAS variáveis a API não
      # revalida e o cardápio só atualiza pelo ISR (até 30 s). O mesmo segredo vale no web (abaixo); vazio = desligado.
      WEB_INTERNAL_URL: http://web:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-MeuCardapio <onboarding@resend.dev>}
      TRIAL_DAYS: ${TRIAL_DAYS:-7}
      # Captcha do pedido público (NG-08): off | turnstile. Com turnstile a API recusa subir sem TURNSTILE_SECRET_KEY;
      # o web precisa de NEXT_PUBLIC_TURNSTILE_SITE_KEY no build. Só é cobrado de quem já tem 2 pedidos pendentes.
      CAPTCHA_MODE: ${CAPTCHA_MODE:-off}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # SEC-13: em produção a API NÃO sobe com MFA_ENFORCED diferente de "true" (guarda de partida em lib/mfaBoot.ts). Padrão SEGURO: true.
      MFA_ENFORCED: ${MFA_ENFORCED:-true}
      # Fotos do cardápio (API-18, ADR-0017, decisão do Claudio 18/11): em DISCO LOCAL do servidor (volume uploads_data), sem S3/R2. A pasta é FIXA em /uploads
      # (é onde o volume está montado); o Caddy serve esse volume somente leitura em /media. Com STORAGE_DRIVER=s3 valem as variáveis STORAGE_S3_* abaixo
      # (vazias de propósito: quem valida é o check-env.sh --prod, que o deploy.sh usa).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # Prato 3D: vazio = desligado; fal = Rodin via fal.ai (FAL_KEY)
      DISH3D_PROVIDER: ${DISH3D_PROVIDER:-}
      FAL_KEY: ${FAL_KEY:-}
      DISH3D_CREDITS: ${DISH3D_CREDITS:-300}
      # Reels (ADR-0021): desligado por padrão; true liga (além do recurso `reels` no plano)
      REELS_ENABLED: ${REELS_ENABLED:-false}
      STORAGE_LOCAL_DIR: /uploads
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-${WEB_ORIGIN}/media}
    volumes:
      - uploads_data:/uploads   # fotos (leitura e escrita só aqui)
    expose:
      - "3001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL no .env (fixado no build da imagem web)}
        # Também fixados no build: chave PÚBLICA do captcha e a tela de campanha (vazio = desligado).
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_MENU_CAMPAIGN_ENABLED: ${NEXT_PUBLIC_MENU_CAMPAIGN_ENABLED:-}
    image: meucardapio-web:${APP_VERSION:-local}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Chamadas servidor-a-servidor do cardápio (SSR/ISR) vão direto à API pela rede interna: sem isto o padrão do código é
      # http://localhost:3001, que dentro deste container NÃO é a API (o cardápio cairia no plano B do navegador sem avisar).
      API_INTERNAL_URL: http://api:3001
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}   # a rota /api/revalidate do web só abre com o MESMO segredo da API; vazio = fechada
      # Segredo de serviço (SEC-24): só em tempo de EXECUÇÃO e só no servidor. Nunca NEXT_PUBLIC_*, nunca ARG de build,
      # nunca no código. A API só confia no IP repassado pelo web quando este segredo confere.
      API_INTERNAL_SECRET: ${API_INTERNAL_SECRET:?defina API_INTERNAL_SECRET no .env (32+ caracteres; openssl rand -hex 32)}
    expose:
      - "3000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    build:
      context: ./caddy
    image: meucardapio-caddy:${APP_VERSION:-local}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Privilégio mínimo: sem capabilities, só a de abrir as portas 80/443; sistema de arquivos somente leitura (só /data,
    # /config e /tmp são graváveis). Provado pelo smoke: o Caddy sobe e atende assim.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - api
      - web
    networks:
      default:
        ipv4_address: ${CADDY_IP:-172.29.250.10}   # fixo: é o único IP em que a API confia (TRUST_PROXY_CIDR)
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
      # O Go passa a devolver memória ANTES de bater no teto do container (mem_limit); sem isso ele retém o heap liberado e o
      # container pode ser morto por falta de memória. É um TETO, não uma reserva. Mantenha ~20% abaixo do mem_limit.
      GOMEMLIMIT: 600MiB
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/srv/uploads:ro   # fotos servidas em /media, SOMENTE LEITURA (o proxy não escreve nem executa nada)
    # Teto de memória (ST-49/ST-50). Medido: 6 a 7 KB por IP distinto na janela. Decisão do Atlas (17/11): 768 MB, porque com 512 MB
    # o Caddy chegou a ~450 MB sob rotatividade alta de IPs (o cenário do ataque) e a folga era pequena. É um TETO (custo só de RAM
    # se for usado). O smoke exige que o teto sustente >= 60 mil IPs a 80%. Acima disso (ataque distribuído) o Caddy é morto e volta
    # em segundos (restart); risco ACEITO: tratar na borda/CDN. RISCO ABERTO: há um crescimento lento que não expliquei (ST-50-levas.md).
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]   # API de administração do Caddy, só dentro do container
      interval: 15s
      timeout: 5s
      retries: 5

  # Backup lógico do Postgres, verificado a cada execução (scripts/backup/backup.sh): dump vazio ou
  # sem as tabelas é recusado e o healthcheck acusa. Guarda ./backups (host), NO MESMO servidor; a cópia
  # externa cifrada é o serviço backup-offsite abaixo (perfil "offsite").
  # Prova de restauração: scripts/backup/restore-verify.sh.
  postgres-backup:
    networks: [data]
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully   # sem tabelas o backup (corretamente) recusa
    environment:
      PGHOST: postgres
      PGUSER: meucardapio
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGDATABASE: meucardapio
      BACKUP_DIR: /backups
      UPLOADS_DIR: /uploads
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - uploads_data:/uploads:ro   # fotos entram no backup (backup-uploads.sh), leitura apenas
      - ../scripts/backup:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/scripts/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      start_period: 5m
      retries: 1

  # Cópia OFF-SITE cifrada (CL-12): só sobe com o perfil "offsite" (COMPOSE_PROFILES=offsite no .env). Lê ./backups
  # SOMENTE LEITURA (o que o postgres-backup já verificou), cifra no cliente (rclone crypt) e envia para um bucket S3
  # compatível fora deste servidor. Fica na rede de borda (precisa de internet) e NÃO alcança o banco.
  # Restaurar: scripts/backup/offsite-restore.sh (RUNBOOK-infra §5c). Regras do .env: check-env.sh.
  backup-offsite:
    profiles: [offsite]
    image: rclone/rclone:1.68.2
    restart: unless-stopped
    logging: *default-logging
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]   # só LER ./backups (pasta 700 do usuário postgres, uid 70); sem escrita lá (montagem :ro)
    security_opt:
      - no-new-privileges:true
    depends_on:
      - postgres-backup
    environment:
      BACKUP_DIR: /backups
      STATE_DIR: /state
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      OFFSITE_S3_PROVIDER: ${OFFSITE_S3_PROVIDER:-Other}
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_REGION: ${OFFSITE_S3_REGION:-auto}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      OFFSITE_S3_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      OFFSITE_PREFIX: ${OFFSITE_PREFIX:-vitry}
      OFFSITE_CRYPT_PASSWORD: ${OFFSITE_CRYPT_PASSWORD:-}
      OFFSITE_CRYPT_SALT: ${OFFSITE_CRYPT_SALT:-}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups:ro
      - offsite_state:/state
      - ../scripts/backup:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/offsite-loop.sh"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/scripts/offsite-healthcheck.sh"]
      interval: 10m
      timeout: 10s
      start_period: 30m
      retries: 1

networks:
  # data: só Postgres, migrate, backup e API. internal: true = sem saída à internet nem acesso do Caddy/web ao banco.
  data:
    internal: true
    ipam:
      config:
        # Faixa FIXA também aqui: sem ela o Docker sorteia um /16 do pool (ex.: 172.29.0.0/16) que pode ENGLOBAR a faixa
        # fixa da rede de borda e a criação falha com "Pool overlaps" (visto no smoke de 17/11, com 172.28 já ocupada).
        - subnet: ${DATA_SUBNET:-172.29.251.0/24}
  # default = rede de borda (Caddy, web, API); sub-rede e IP do Caddy fixos (a API só confia no X-Forwarded-For dele).
  default:
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.29.250.0/24}   # troque (e CADDY_IP) se colidir com outra rede Docker do servidor

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  offsite_state:  # marcador OFFSITE_LAST_OK da cópia externa
  uploads_data:   # fotos do cardápio (ADR-0017): persistente; entra no backup; NUNCA use `down -v` em produção
